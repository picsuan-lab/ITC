<section>
<h2>Conversion</h2>
<div class="grid">
  <div class="card"><label for="c2f">Celsius (°C)</label><input id="c2f" type="number" step="any">
    <button class="primary" data-conv="c2f">Convert to Fahrenheit</button><p class="result" id="r-c2f"></p></div>
  <div class="card"><label for="f2c">Fahrenheit (°F)</label><input id="f2c" type="number" step="any">
    <button class="primary" data-conv="f2c">Convert to Celsius</button><p class="result" id="r-f2c"></p></div>
  <div class="card"><label for="m2f">Meters (m)</label><input id="m2f" type="number" step="any">
    <button class="primary" data-conv="m2f">Convert to feet</button><p class="result" id="r-m2f"></p></div>
  <div class="card"><label for="f2m">Feet (ft)</label><input id="f2m" type="number" step="any">
    <button class="primary" data-conv="f2m">Convert to meters</button><p class="result" id="r-f2m"></p></div>
</div>
